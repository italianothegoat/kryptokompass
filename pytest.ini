# Was macht diese Datei?
# Einstellungen für pytest, damit die Tests "from src..." importieren können.

[pytest]
# Den Projektordner zum Python-Suchpfad hinzufügen, damit "import src" funktioniert
pythonpath = .
# Tests nur im Ordner tests/ suchen
testpaths = tests
# Das Test-Zusatzmodul von Dash abschalten (brauchen wir nicht, es erzeugt nur Warnungen)
addopts = -p no:dash
